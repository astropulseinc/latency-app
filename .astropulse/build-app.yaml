# Builds latency-app from this repository with kpack: each commit on main becomes a new image.
apiVersion: platform.astropulse.io/v1
kind: Application
spec:
  name: latency-app-build
  profileName: latency-app-profile
  namespace: kpack
  source:
    type: YAML
    yaml:
      repo:
        repoURL: https://github.com/your-org/latency-app.git
        targetRevision: main
        path: .astropulse/resources
