# Runs the image kpack built, served on your verified domain with TLS.
apiVersion: platform.astropulse.io/v1
kind: Application
spec:
  name: latency-app
  profileName: latency-app-profile
  namespace: latency-app
  source:
    type: Image
    image:
      registry: ghcr.io
      repository: your-org/latency-app
      tag: v1.0.0
      port: 8080
  externalAccess:
    domain: your-domain.com
