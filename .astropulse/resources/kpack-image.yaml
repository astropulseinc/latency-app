# kpack Image: builds the source on main with buildpacks and pushes it to your registry.
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: latency-app
spec:
  tag: ghcr.io/your-org/latency-app
  serviceAccountName: kpack-service-account
  builder:
    name: default
    kind: ClusterBuilder
  source:
    git:
      url: https://github.com/your-org/latency-app
      revision: main
