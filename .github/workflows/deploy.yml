name: Deploy to AstroPulse

# Ships an image kpack built for this repository as the next version of latency-app.
# Add an AstroPulse API key as the ASTROPULSE_API_KEY repository secret, then run it with the tag to ship.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The image tag kpack built, such as b2.20260101.120000"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTROPULSE_API_KEY: ${{ secrets.ASTROPULSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install astroctl
        run: curl -fsSL https://astropulse.io/install.sh | bash

      - name: Deploy the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sed -i "s|^\( *tag:\).*|\1 ${TAG}|" .astropulse/deploy-app.yaml
          astroctl app apply -f .astropulse/deploy-app.yaml
