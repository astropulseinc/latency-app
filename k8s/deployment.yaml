apiVersion: apps/v1
kind: Deployment
metadata:
  name: latency
  labels:
    app.kubernetes.io/name: latency
    app.kubernetes.io/instance: latency
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: latency
      app.kubernetes.io/instance: latency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: latency
        app.kubernetes.io/instance: latency
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: latency
          image: docker.io/astropulseinc/latency-app:v1.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi

